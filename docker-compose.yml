version: '3.8'

services:
  whisperer:
    image: gluesync-whisperer:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisperer
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./:/app  # Mount the entire project for live code changes
    environment:
      - DB_URL=sqlite:///./data/whisperer.db
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - DEFAULT_OPERATION_DELAY=1.0
      - DEFAULT_BATCH_SIZE=1
      - MAX_OPERATIONS=0
      - INSERT_WEIGHT=0.33
      - UPDATE_WEIGHT=0.33
      - DELETE_WEIGHT=0.34
      - JAVA_HOME=/usr/lib/jvm/zulu21-ca-amd64
      
  jdbc-test:
    image: gluesync-whisperer:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdbc-test
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./:/app  # Mount the entire project for testing
    environment:
      - DB_URL=sqlite:///./data/whisperer.db
      - DEBUG=true
      - JAVA_HOME=/usr/lib/jvm/zulu21-ca-amd64
      - PYTHONUNBUFFERED=1
    command: >  # Override the default command to keep the container running
      bash -c "tail -f /dev/null"
