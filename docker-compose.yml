version: '3.8'

services:
  whisperer:
    image: gluesync-whisperer:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisperer
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # - ./:/app  # Mount the entire project for live code changes
    environment:
      - DB_URL=sqlite:///./data/whisperer.db
      - PORT=8000
      - DEBUG=true
      
