stages:
  - deploy

default:
  tags:
    - gs-runners-hq

variables:
  DOCKER_TLS_CERTDIR: ""
  PYTEST_ADDOPTS: "--color=yes"

deploy:
  stage: deploy
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building & deploying Gluesync Whisperer..."
    
    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update
    
    - apk add --no-cache bash git
    
    # Parse the tag to get version information
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION=${CI_COMMIT_TAG#v}  # Remove 'v' prefix if present
      else
        VERSION="latest"
      fi
      
      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      ADDITIONAL_TAG="${DEFAULT_NAME}:${TAGPART}"

      DEFAULT_TAG="${DEFAULT_NAME}:${VERSION}"
      LATEST_TAG="${DEFAULT_NAME}:latest"

    # Set up Docker Buildx for multi-platform builds
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    
    # Install QEMU for multi-architecture builds
    - docker run --privileged --rm tonistiigi/binfmt --install all
    
    # Create and use a new builder instance
    - docker buildx create --name multiarch-builder --use
    - docker buildx inspect --bootstrap
    
    # Build and push multi-platform images
    - |
      docker buildx build --platform linux/amd64,linux/arm64 \
        --tag "$DEFAULT_TAG" \
        --tag "$LATEST_TAG" \
        --build-arg VERSION=$VERSION \
        --push .
  rules:
    - if: $CI_COMMIT_TAG
