stages:
  - build-frontend
  - deploy

default:
  tags:
    - gs-runners-hq

variables:
  DOCKER_TLS_CERTDIR: ""
  PYTEST_ADDOPTS: "--color=yes"
  NODE_VERSION: "18"
  DOCKER_REGISTRY: "registry.gitlab.com"
  APP_NAME: "molo17/gluesync-whisperer"
  TAGPART: "latest"

# Build Frontend
build-frontend:
  stage: build-frontend
  image: node:18-alpine
  script:
    - echo "Building React frontend..."
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - echo "Frontend build completed successfully"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - tags
    - main
    - develop

deploy:
  stage: deploy
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_DRIVER: overlay2
  dependencies:
    - build-frontend
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - echo "Building & deploying Gluesync Whisperer..."

    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update

    - apk add --no-cache bash git

    - |
      set -euo pipefail

      if [ -z "${CI_COMMIT_TAG:-}" ]; then
        echo "This job only runs for tagged commits."
        exit 1
      fi

      TAGPART=$(echo "$CI_COMMIT_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)')
      if [ -z "$TAGPART" ]; then
        echo "Unable to extract semantic version from tag: $CI_COMMIT_TAG"
        exit 1
      fi

      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      VERSION_TAG="${DEFAULT_NAME}:${TAGPART}"

      echo "${TAGPART}" > VERSION
      echo "VERSION file created with content: $(cat VERSION)"

      if [[ $CI_COMMIT_TAG == release-* ]]; then
        RELEASE_CHANNEL="release"
      elif [[ $CI_COMMIT_TAG == beta-* ]]; then
        RELEASE_CHANNEL="beta"
      elif [[ $CI_COMMIT_TAG == tag-* ]]; then
        RELEASE_CHANNEL="alpha"
      else
        echo "Unknown tag format: $CI_COMMIT_TAG"
        exit 1
      fi

      export DEFAULT_NAME VERSION_TAG RELEASE_CHANNEL

    # Set up Docker registry authentication
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"

    # Build and push images according to release channel
    - |
      set -euo pipefail

      if [ "$RELEASE_CHANNEL" = "release" ]; then
        echo "Building multi-arch release image with latest tag..."
        docker run --privileged --rm tonistiigi/binfmt --install all
        docker buildx create --name multiarch-builder --use
        docker buildx inspect --bootstrap
        docker buildx build --platform linux/amd64,linux/arm64 \
          --no-cache \
          --tag "${DEFAULT_NAME}:latest" \
          --tag "${VERSION_TAG}" \
          --push .
      elif [ "$RELEASE_CHANNEL" = "beta" ]; then
        echo "Building multi-arch beta image with beta tag..."
        docker run --privileged --rm tonistiigi/binfmt --install all
        docker buildx create --name multiarch-builder --use
        docker buildx inspect --bootstrap
        docker buildx build --platform linux/amd64,linux/arm64 \
          --no-cache \
          --tag "${DEFAULT_NAME}:beta" \
          --tag "${VERSION_TAG}" \
          --push .
      else
        echo "Building single-arch tag image..."
        docker build --no-cache --tag "${VERSION_TAG}" .
        docker push "${VERSION_TAG}"
      fi
  rules:
    - if: $CI_COMMIT_TAG

update_budibase_version:
  stage: deploy
  image: alpine:latest
  needs:
    - job: deploy
  script:
    - apk add --no-cache bash curl jq
    - |
      set -euo pipefail

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        MODULE_VERSION=$(echo "$CI_COMMIT_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)')

        if [[ "$CI_COMMIT_TAG" == release-* ]]; then
          RELEASE_TYPE="GA"
        elif [[ "$CI_COMMIT_TAG" == beta-* ]]; then
          RELEASE_TYPE="BETA"
        elif [[ "$CI_COMMIT_TAG" == tag-* ]]; then
          RELEASE_TYPE="ALPHA"
        else
          echo "[ERROR] Unknown tag format"
          exit 1
        fi
      else
        echo "[ERROR] Not a tracked tag"
        exit 1
      fi

      BUILD_TAG="whisperer"

      echo "[INFO] Updating Budibase version: BUILD_TAG=$BUILD_TAG, MODULE_VERSION=$MODULE_VERSION, RELEASE_TYPE=$RELEASE_TYPE"

      SEARCH_PAYLOAD="{
        \"query\": {
          \"equal\": {
            \"internalName\": \"$BUILD_TAG\"
          }
        },
        \"paginate\": false,
        \"limit\": 1000
      }"

      SEARCH_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
        -H "x-budibase-app-id: $BUDIBASE_APP_ID" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -H "x-budibase-api-key: $BUDIBASE_API_KEY" \
        -d "$SEARCH_PAYLOAD" \
        "$BUDIBASE_BASE_URL/tables/datasource_plus_3dbc0976d090472f82658f287ec8ad6d__AvailableAgents/rows/search")

      SEARCH_BODY=$(echo "$SEARCH_RESPONSE" | sed -e '$d')
      SEARCH_STATUS=$(echo "$SEARCH_RESPONSE" | tail -n 1)

      if [ "$SEARCH_STATUS" -ne 200 ]; then
        echo "Failed to search for row. HTTP Status: $SEARCH_STATUS"
        echo "Response: $SEARCH_BODY"
        echo "Search Payload: $SEARCH_PAYLOAD"
        exit 1
      fi

      ROW_ID=$(echo "$SEARCH_BODY" | jq -r '.data[0]._id // empty')

      if [ -z "$ROW_ID" ]; then
        echo "No matching row found for INTERNAL_NAME: $BUILD_TAG"
        exit 1
      fi

      if [ "$RELEASE_TYPE" = "ALPHA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionAlpha\": \"$MODULE_VERSION\"
        }"
      elif [ "$RELEASE_TYPE" = "BETA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionBeta\": \"$MODULE_VERSION\"
        }"
      elif [ "$RELEASE_TYPE" = "GA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionGA\": \"$MODULE_VERSION\"
        }"
      else
        echo "Unrecognized value: $RELEASE_TYPE"
        exit 1
      fi

      UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
        -H "x-budibase-app-id: $BUDIBASE_APP_ID" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -H "x-budibase-api-key: $BUDIBASE_API_KEY" \
        -d "$UPDATE_PAYLOAD" \
        "$BUDIBASE_BASE_URL/tables/datasource_plus_3dbc0976d090472f82658f287ec8ad6d__AvailableAgents/rows/$ROW_ID")

      UPDATE_BODY=$(echo "$UPDATE_RESPONSE" | sed -e '$d')
      UPDATE_STATUS=$(echo "$UPDATE_RESPONSE" | tail -n 1)

      echo "Budibase API update response code: $UPDATE_STATUS"
      echo "Budibase API update response: $UPDATE_BODY"

      if [ "$UPDATE_STATUS" -ge 200 ] && [ "$UPDATE_STATUS" -lt 300 ]; then
          echo "Successfully updated version on Budibase"
      else
          echo "Failed to update version on Budibase. HTTP Status: $UPDATE_STATUS"
          exit 1
      fi
  rules:
    - if: "$CI_COMMIT_TAG =~ /^release-/"
    - if: "$CI_COMMIT_TAG =~ /^beta-/"
    - if: "$CI_COMMIT_TAG =~ /^tag-/"

update_dockerhub_readme:
  stage: deploy
  image: alpine:latest
  needs:
    - job: deploy
  script:
    - apk add --no-cache curl jq python3
    - |
      set -euo pipefail

      if [ -z "${CI_REGISTRY_USER:-}" ] || [ -z "${CI_REGISTRY_PASSWORD:-}" ] || [ -z "${APP_NAME:-}" ]; then
        echo "CI_REGISTRY_USER, CI_REGISTRY_PASSWORD and APP_NAME variables must be set"
        exit 1
      fi
    - |
      python3 - <<'PY' > dockerhub-readme.json
      import json
      from pathlib import Path

      readme_path = Path("DOCKER_IMAGE_README.md")
      content = readme_path.read_text(encoding="utf-8")
      print(json.dumps({"full_description": content}))
      PY
    - |
      set -euo pipefail

      echo "Authenticating with Docker Hub..."
      TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}" | jq -r '.token')

      if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
        echo "Failed to obtain Docker Hub token"
        exit 1
      fi

      echo "Updating Docker Hub description from DOCKER_IMAGE_README.md..."
      RESPONSE_CODE=$(curl -s -o dockerhub-response.json -w "%{http_code}" \
        -X PATCH "https://hub.docker.com/v2/repositories/${APP_NAME}" \
        -H "Authorization: JWT ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d @dockerhub-readme.json)

      cat dockerhub-response.json

      if [ "$RESPONSE_CODE" -lt 200 ] || [ "$RESPONSE_CODE" -ge 300 ]; then
        echo "Failed to update Docker Hub README (HTTP $RESPONSE_CODE)"
        exit 1
      fi

      echo "Docker Hub README updated successfully."
  rules:
    - if: $CI_COMMIT_TAG
