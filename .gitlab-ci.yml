stages:
  - build-frontend
  - build-backend
  - deploy

default:
  tags:
    - gs-runners-hq

variables:
  DOCKER_TLS_CERTDIR: ""
  PYTEST_ADDOPTS: "--color=yes"
  NODE_VERSION: "18"
  DOCKER_REGISTRY: "registry.gitlab.com"
  APP_NAME: "molo17/gluesync-whisperer"
  TAGPART: "latest"

# Build Frontend
build-frontend:
  stage: build-frontend
  image: node:18-alpine
  script:
    - echo "Building React frontend..."
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - echo "Frontend build completed successfully"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - tags
    - main
    - develop

# Build Backend & Deploy
build-backend:
  stage: build-backend
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_DRIVER: overlay2
  dependencies:
    - build-frontend
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - echo "Building & deploying Gluesync Whisperer..."

    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update

    - apk add --no-cache bash git

    # Parse the tag to get version information
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION=${CI_COMMIT_TAG#v}  # Remove 'v' prefix if present
      else
        VERSION="latest"
      fi

      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      ADDITIONAL_TAG="${DEFAULT_NAME}:${TAGPART}"

      DEFAULT_TAG="${DEFAULT_NAME}:${VERSION}"
      LATEST_TAG="${DEFAULT_NAME}:latest"

    # Set up Docker Buildx for multi-platform builds
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"

    # Build and push multi-platform images
    - |
      docker buildx build --platform linux/amd64,linux/arm64 \
        --tag "$DEFAULT_TAG" \
        --tag "$LATEST_TAG" \
        --build-arg VERSION=$VERSION \
        --push .
  only:
    - tags
    - main
    - develop

deploy:
  stage: deploy
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
        DOCKER_DRIVER: overlay2
  dependencies:
    - build-frontend
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - echo "Deploying Gluesync Whisperer..."

    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update

    - apk add --no-cache bash git

    # Parse the tag to get version information
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION=${CI_COMMIT_TAG#v}  # Remove 'v' prefix if present
      else
        VERSION="latest"
      fi

      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      ADDITIONAL_TAG="${DEFAULT_NAME}:${TAGPART}"

      DEFAULT_TAG="${DEFAULT_NAME}:${VERSION}"
      LATEST_TAG="${DEFAULT_NAME}:latest"

    # Set up Docker Buildx for multi-platform builds
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"

    - |
      docker build -t "$DEFAULT_TAG" -t "$LATEST_TAG" .
      docker push "$DEFAULT_TAG"
      docker push "$LATEST_TAG"
  rules:
    - if: $CI_COMMIT_TAG
